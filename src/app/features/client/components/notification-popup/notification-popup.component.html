<div class="notification-container">
  <button class="notification-bell" (click)="togglePopup()">
    🔔
    <span class="badge" *ngIf="unreadCount > 0">{{ unreadCount }}</span>
  </button>

  <div class="notification-dropdown" *ngIf="isOpen">
    <div class="dropdown-header">
      <span>Notifications</span>
      <button *ngIf="unreadCount > 0" class="mark-all" (click)="markAllAsRead()">
        Tout marquer comme lu
      </button>
    </div>

    <div class="dropdown-content">
      <div *ngIf="notifications.length === 0" class="empty">
        Aucune notification
      </div>
      
      <div *ngFor="let notif of notifications" 
           class="notification-item" 
           [class.unread]="!notif.isRead"
           (click)="markAsRead(notif.id, $event)">
        <div class="notif-icon">{{ getTypeIcon(notif.type) }}</div>
        <div class="notif-content">
          <div class="notif-title">{{ notif.title }}</div>
          <div class="notif-message">{{ notif.message }}</div>
          <div class="notif-time">{{ getTimeAgo(notif.createdAt) }}</div>
        </div>
      </div>
    </div>
  </div>
</div>
