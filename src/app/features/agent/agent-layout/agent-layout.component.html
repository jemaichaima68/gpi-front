<p-toast position="top-right" />

<ion-app>
  <ion-split-pane contentId="agent-main-content">

    <!-- SIDEBAR -->
    <ion-menu contentId="agent-main-content" menuId="agent-menu">
      
      <!-- HEADER SIDEBAR -->
      <ion-header>
        <ion-toolbar>
          <ion-title class="logo-title">
            <i class="pi pi-send" style="font-size: 1.3rem; margin-right: 8px;"></i>
            GPI Tracker
          </ion-title>
        </ion-toolbar>
      </ion-header>

      <!-- MENU ITEMS (PARTIE HAUTE) -->
      <ion-content>
        <ion-list lines="none">
          <!-- Éléments normaux (sans sous-menu) -->
          <ng-container *ngFor="let item of menuItems">
            <ng-container *ngIf="!item.isParent; else parentItem">
              <ion-menu-toggle auto-hide="false">
                <ion-item
                  [routerLink]="item.route"
                  routerLinkActive="active-item"
                  button
                  detail="false">
                  <ion-icon [name]="item.icon" slot="start"></ion-icon>
                  <ion-label class="menu-label">{{ item.label }}</ion-label>
                </ion-item>
              </ion-menu-toggle>
            </ng-container>
            
            <!-- Éléments avec sous-menu (Transactions) -->
            <ng-template #parentItem>
              <ion-item 
                button 
                detail="false" 
                (click)="toggleSubMenu(item)"
                class="menu-parent">
                <ion-icon [name]="item.icon" slot="start"></ion-icon>
                <ion-label class="menu-label">{{ item.label }}</ion-label>
                <ion-icon slot="end" [name]="item.expanded ? 'chevron-down-outline' : 'chevron-forward-outline'"></ion-icon>
              </ion-item>
              
              <!-- Sous-menu -->
              <div *ngIf="item.expanded" class="submenu">
                <ion-menu-toggle auto-hide="false" *ngFor="let child of item.children">
                  <ion-item
                    [routerLink]="child.route"
                    routerLinkActive="active-item"
                    button
                    detail="false"
                    class="submenu-item">
                    <ion-icon [name]="child.icon" slot="start"></ion-icon>
                    <ion-label class="menu-label">{{ child.label }}</ion-label>
                  </ion-item>
                </ion-menu-toggle>
              </div>
            </ng-template>
          </ng-container>
        </ion-list>
      </ion-content>

      <!-- FOOTER SIDEBAR (PARTIE BASSE : PROFIL + DÉCONNEXION) -->
      <ion-footer>
        <ion-toolbar>
          <!-- Mon Profil -->
          <ion-menu-toggle auto-hide="false" *ngFor="let item of bottomItems">
            <ion-item
              [routerLink]="item.route"
              routerLinkActive="active-item"
              button
              detail="false">
              <ion-icon [name]="item.icon" slot="start"></ion-icon>
              <ion-label class="menu-label">{{ item.label }}</ion-label>
            </ion-item>
          </ion-menu-toggle>

          <!-- Déconnexion -->
          <ion-item
            lines="none"
            button
            detail="false"
            (click)="onLogout($event)"
            class="logout-item">
            <ion-icon name="log-out-outline" slot="start"></ion-icon>
            <ion-label class="menu-label">Déconnexion</ion-label>
          </ion-item>
        </ion-toolbar>
      </ion-footer>

    </ion-menu>

    <!-- MAIN CONTENT -->
    <div class="ion-page" id="agent-main-content">
      
      <!-- NAVBAR -->
      <ion-header>
        <ion-toolbar class="main-navbar-toolbar">
          <ion-buttons slot="start">
            <ion-menu-button></ion-menu-button>
          </ion-buttons>

          <div class="toolbar-center">
            <span class="page-title-text">Espace Agent Back-Office</span>
          </div>

          <ion-buttons slot="end">
            <div class="navbar-avatar-btn" (click)="goToProfile()">
              {{ avatarInitials }}
            </div>
          </ion-buttons>
        </ion-toolbar>
      </ion-header>

      <!-- PAGE CONTENT -->
      <ion-content class="ion-padding">
        <router-outlet></router-outlet>
      </ion-content>

    </div>

  </ion-split-pane>
</ion-app>
