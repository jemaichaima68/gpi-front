<p-toast position="top-right" />

<ion-app>
  <ion-split-pane contentId="agent-main-content">

    <!-- SIDEBAR -->
    <ion-menu contentId="agent-main-content" menuId="agent-menu">

      <!-- HEADER SIDEBAR -->
      <ion-header>
        <ion-toolbar>
          <ion-title>
            <ion-icon name="send-outline" style="margin-right: 8px;"></ion-icon>
            GPI Tracker
          </ion-title>
        </ion-toolbar>
      </ion-header>

      <!-- MENU ITEMS -->
      <ion-content>
        <ion-list lines="none">
          <ng-container *ngFor="let item of menuItems">
            <!-- Élément parent avec sous-menu -->
            <ng-container *ngIf="item.isParent; else normalItem">
              <ion-item button detail="false" (click)="toggleSubMenu(item)" class="menu-parent">
                <ion-icon [name]="item.icon" slot="start"></ion-icon>
                <ion-label>{{ item.label }}</ion-label>
                <ion-icon slot="end" [name]="item.expanded ? 'chevron-down-outline' : 'chevron-forward-outline'"></ion-icon>
              </ion-item>
              
              <!-- Sous-menu (affiché si expanded) -->
              <ion-list lines="none" *ngIf="item.expanded" class="submenu">
                <ion-item 
                  *ngFor="let child of item.children" 
                  [routerLink]="child.route" 
                  routerLinkActive="active-item" 
                  button 
                  detail="false" 
                  class="submenu-item">
                  <ion-icon [name]="child.icon" slot="start"></ion-icon>
                  <ion-label>{{ child.label }}</ion-label>
                </ion-item>
              </ion-list>
            </ng-container>
            
            <!-- Élément normal (sans sous-menu) -->
            <ng-template #normalItem>
              <ion-item 
                [routerLink]="item.route" 
                routerLinkActive="active-item" 
                button 
                detail="false">
                <ion-icon [name]="item.icon" slot="start"></ion-icon>
                <ion-label>{{ item.label }}</ion-label>
              </ion-item>
            </ng-template>
          </ng-container>
        </ion-list>
      </ion-content>

      <!-- FOOTER SIDEBAR -->
      <ion-footer>
        <ion-toolbar>
          <ion-item lines="none" button detail="false" (click)="goToProfile()" style="cursor: pointer;">
            <ion-icon name="person-circle-outline" slot="start"></ion-icon>
            <ion-label>
              <h3>{{ username }}</h3>
              <p>Agent Back-Office</p>
            </ion-label>
            <ion-icon
              name="log-out-outline"
              slot="end"
              style="cursor: pointer; font-size: 1.4rem;"
              (click)="onLogout($event)">
            </ion-icon>
          </ion-item>
        </ion-toolbar>
      </ion-footer>

    </ion-menu>

    <!-- MAIN CONTENT -->
    <div class="ion-page" id="agent-main-content">

      <!-- NAVBAR -->
      <ion-header>
        <ion-toolbar class="main-navbar-toolbar">
          <ion-buttons slot="start">
            <ion-menu-button></ion-menu-button>
          </ion-buttons>
          <ion-title>Espace Agent Back-Office</ion-title>
          <ion-buttons slot="end">
            <div class="navbar-avatar-btn" (click)="goToProfile()">
              {{ avatarInitials }}
            </div>
          </ion-buttons>
        </ion-toolbar>
      </ion-header>

      <!-- PAGE CONTENT -->
      <ion-content class="ion-padding">
        <router-outlet></router-outlet>
      </ion-content>

    </div>

  </ion-split-pane>
</ion-app>
